<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tracker - Network Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; text-align: center; }
    .ok { color: #2ecc71; font-size: 1.5rem; }
    .fail { color: #e74c3c; font-size: 1.5rem; }
    code { background: #222; padding: 2px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>🔌 Network Connectivity Test</h2>
  <p>Server IP: <code id="server-ip"></code></p>
  <div id="results"></div>
  <script>
    const ip = location.hostname;
    document.getElementById('server-ip').textContent = ip;
    
    async function test(url, label) {
      try {
        const r = await fetch(url);
        return { label, ok: r.ok, status: r.status };
      } catch(e) {
        return { label, ok: false, error: e.message };
      }
    }

    async function run() {
      const results = document.getElementById('results');
      const tests = [
        ['/', 'Homepage'],
        ['/report.html', 'Reporter Page'],
        ['/api/devices', 'API: Devices'],
        ['/api/stats', 'API: Stats'],
      ];
      
      let html = '';
      for (const [path, label] of tests) {
        const r = await test(path, label);
        const cls = r.ok ? 'ok' : 'fail';
        const icon = r.ok ? '✅' : '❌';
        html += `<p class="${cls}">${icon} ${label} → ${r.ok ? 'OK ('+r.status+')' : 'FAIL (' + (r.error || r.status) + ')'}</p>`;
      }
      results.innerHTML = html;
    }
    run();
  </script>
</body>
</html>

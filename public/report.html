<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker Reporter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f; color: #eee;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a2e; border-radius: 16px; padding: 24px;
      width: 100%; max-width: 380px; box-shadow: 0 8px 32px #0008;
    }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 20px; }
    label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 4px; }
    select, input {
      width: 100%; background: #252540; border: 1px solid #444; color: #eee;
      padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px;
    }
    select:focus, input:focus { outline: none; border-color: #00d2ff; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .btn-start { background: #00d2ff; color: #000; }
    .btn-start:hover { background: #00b8d9; }
    .btn-stop { background: #e74c3c; color: #fff; }
    .btn-stop:hover { background: #c0392b; }
    .btn-hide { display: none; }

    .status {
      text-align: center; margin-top: 16px; padding: 10px;
      border-radius: 8px; font-size: 0.8rem;
    }
    .status.waiting { background: #252540; color: #888; }
    .status.active { background: #1a3a2a; color: #2ecc71; }
    .status.error { background: #3a1a1a; color: #e74c3c; }

    .coords {
      margin-top: 16px; background: #252540; border-radius: 8px; padding: 12px;
      font-family: monospace; font-size: 0.8rem; text-align: center;
    }
    .coords .latlng { font-size: 1rem; color: #00d2ff; }
    .coords .meta { color: #888; font-size: 0.7rem; margin-top: 4px; }

    .pulse {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #2ecc71; margin-right: 6px; animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 Tracker Reporter</h1>
    <p class="subtitle">Share your real GPS location to the tracker</p>

    <label>Device ID</label>
    <select id="device-select">
      <option value="">Loading devices...</option>
    </select>

    <label>Custom ID (optional)</label>
    <input id="custom-id" placeholder="e.g. my-phone-123" />

    <button class="btn btn-start" id="btn-start" onclick="startTracking()">▶ Start Tracking</button>
    <button class="btn btn-stop btn-hide" id="btn-stop" onclick="stopTracking()">⏹ Stop</button>

    <div class="status waiting" id="status">Waiting to start...</div>
    <div class="coords" id="coords">
      <div class="latlng">-- , --</div>
      <div class="meta">No location yet</div>
    </div>
  </div>

  <script>
    let watchId = null;
    let serverUrl = '';
    let selectedDevice = '';

    // Auto-detect server URL
    function detectServer() {
      serverUrl = location.origin;
    }
    detectServer();

    // Load available devices
    async function loadDevices() {
      try {
        const res = await fetch(`${serverUrl}/api/devices`);
        const devices = await res.json();
        const sel = document.getElementById('device-select');
        sel.innerHTML = '<option value="">-- Choose a device --</option>' +
          devices.filter(d => d.active).map(d =>
            `<option value="${d.id}">${d.name} (${d.id})</option>`
          ).join('') +
          '<option value="__custom__">+ Use custom ID</option>';
      } catch (e) {
        document.getElementById('device-select').innerHTML = '<option>Failed to load devices</option>';
      }
    }
    loadDevices();

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function showCoords(lat, lng, accuracy, speed) {
      const el = document.getElementById('coords');
      el.innerHTML = `
        <div class="latlng">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        <div class="meta">Accuracy: ${accuracy?.toFixed(0) || '?'}m · Speed: ${speed?.toFixed(1) || '?'} m/s</div>`;
    }

    async function startTracking() {
      const sel = document.getElementById('device-select');
      const custom = document.getElementById('custom-id').value.trim();

      if (custom) {
        selectedDevice = custom;
      } else if (sel.value && sel.value !== '__custom__') {
        selectedDevice = sel.value;
      } else {
        setStatus('⚠️ Please select a device or enter custom ID', 'error');
        return;
      }

      if (!navigator.geolocation) {
        setStatus('❌ Geolocation not supported in this browser', 'error');
        return;
      }

      setStatus('📍 Requesting GPS access...', 'waiting');

      try {
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude: lat, longitude: lng, accuracy, speed, heading } = pos.coords;
            showCoords(lat, lng, accuracy, speed);
            setStatus(`<span class="pulse"></span> Reporting to server...`, 'active');

            // Send to server
            fetch(`${serverUrl}/api/report`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                device_id: selectedDevice,
                lat, lng,
                speed: speed || 0,
                heading: heading || 0,
              }),
            }).catch(() => setStatus('❌ Failed to reach server', 'error'));
          },
          (err) => {
            setStatus(`❌ GPS error: ${err.message}`, 'error');
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
        );

        // Toggle buttons
        document.getElementById('btn-start').classList.add('btn-hide');
        document.getElementById('btn-stop').classList.remove('btn-hide');

      } catch (e) {
        setStatus(`❌ ${e.message}`, 'error');
      }
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      setStatus('⏹ Tracking stopped', 'waiting');
      document.getElementById('btn-start').classList.remove('btn-hide');
      document.getElementById('btn-stop').classList.add('btn-hide');
    }
  </script>
</body>
</html>
